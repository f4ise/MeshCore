; Waveshare RP2040-LoRa-HF/LF
; https://files.waveshare.com/wiki/RP2040-LoRa/Rp2040-lora-sch.pdf

[rp_mini_rc]
extends = rp2040_base
board = pico
board_build.filesystem_size = 0.5m
build_flags = ${rp2040_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/rp_mini_rc
  -D PIN_GPS_TX=0
  -D PIN_GPS_RX=1
  -D PIN_VBAT_READ=26
  -D SX126X_CURRENT_LIMIT=140
  -D RP2040_CPU_FREQ_MHZ=48
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_DIO_1=11
  -D P_LORA_NSS=13
  -D P_LORA_RESET=10
  -D P_LORA_BUSY=7
  -D P_LORA_SCLK=14
  -D P_LORA_MISO=12
  -D P_LORA_MOSI=15
;  -D P_LORA_TX_LED=25
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_RXEN=6
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
;  -D SX126X_REGULATOR=RADIOLIB_SX126X_REGULATOR_DCDC
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
; Debug options
  ; -D DEBUG_RP2040_WIRE=1
  ; -D DEBUG_RP2040_SPI=1
  ; -D DEBUG_RP2040_CORE=1
  ; -D RADIOLIB_DEBUG_SPI=1
  ; -D DEBUG_RP2040_PORT=Serial
build_src_filter = ${rp2040_base.build_src_filter}
  +<WaveshareBoard.cpp>
  +<helpers/sensors>
  +<../variants/rp_mini_rc>
lib_deps = ${rp2040_base.lib_deps}
  ${sensor_base.lib_deps}

[env:remote_controller]
extends = rp_mini_rc
build_flags = ${rp_mini_rc.build_flags}
  -D ADVERT_NAME='"Remote Controller"'
  -D FIRMWARE_BUILD_DATE='__DATE__ " - Remote Controller"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D TELEM_INA3221_SHUNT_VALUE=0.033
  -D TELEM_BMP280_ADDRESS=0x77
  -D DISABLE_PCF8563_PROBE
  -D DISABLE_RX8130CE_PROBE
  -D FORCE_RTC_TIME
;  -D MESH_PACKET_LOGGING=1
  -D MESH_DEBUG=1
build_src_filter = ${rp_mini_rc.build_src_filter}
   +<../examples/remote_controller>
lib_deps = ${rp_mini_rc.lib_deps}
   robtillaart/TCA9548@^0.3.2
   robtillaart/TCA9555@^0.4.4
   https://github.com/valentintintin/M24M01.git